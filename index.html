<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>




    <form onsubmit="return processarFormulario()">

        <h2>Cadastre-se</h2>

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input 
                type="text" 
                id="nome" 
                name="nome"
                placeholder="Nome completo..."
                required
            >
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input 
                type="date" 
                id="data_nascimento" 
                name="data_nascimento"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input 
                type="tel" 
                id="telefone" 
                name="telefone"
                placeholder="(00) 00000-0000"
            >
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input 
                type="password" 
                id="senha" 
                name="senha"
                minlength="6"
            >
        </div>

        <div class="form-group">
            <label for="idade">Idade:</label>
            <input 
                type="number" 
                id="idade" 
                name="idade"
                min="1"
                max="120"
            >
        </div>

        <div class="form-group">
            <label>Habilidades:</label>

            <label for="html">
                <input type="checkbox" id="html" name="habilidades" value="HTML">
                HTML
            </label>

            <label for="css">
                <input type="checkbox" id="css" name="habilidades" value="CSS">
                CSS
            </label>

            <label for="js">
                <input type="checkbox" id="js" name="habilidades" value="JavaScript">
                JavaScript
            </label>
        </div>

        <div class="form-group">
            <label for="pais">País:</label>

            <select id="pais" name="pais">

                <option value="br">Brasil</option>
                <option value="ar">Argentina</option>
                <option value="py">Paraguai</option>
                <option value="us">Estados Unidos</option>
                <option value="jp">Japão</option>
                <option value="fr">França</option>

            </select>
        </div>

        <div class="form-group">
            <label for="comentarios">Comentários:</label><br>

            <textarea 
                id="comentarios" 
                name="comentarios"
                rows="5"
                cols="40"
                placeholder="Digite seus comentários..."
            ></textarea>
        </div>

        <div class="form-group">
            <button type="submit">Enviar</button>
        </div>

    </form>

    <script src="processa_formulario.js"></script>

</body>
</html>
